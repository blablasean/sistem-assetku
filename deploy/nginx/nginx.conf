# =====================================================================
# Konfigurasi Nginx Production HTTPS (Port 443) Tanpa Port di URL
# Sistem AssetKu Hotel — IP Target: 172.17.10.109
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression untuk Performa Maksimal
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =================================================================
    # HTTPS Server (Port 443) — https://172.17.10.109
    # =================================================================
    server {
        listen       443 ssl http2;
        server_name  172.17.10.109 localhost;

        # File Sertifikat SSL IP 172.17.10.109
        ssl_certificate      ../ssl/server.crt;
        ssl_certificate_key  ../ssl/server.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # -------------------------------------------------------------
        # 1. Serve Frontend Compiled Assets (folder frontend/dist)
        # -------------------------------------------------------------
        location / {
            root   ../../frontend/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------------------
        # 2. Reverse Proxy API Endpoint ke Backend Go (Port 8080)
        # -------------------------------------------------------------
        location /auth/ {
            proxy_pass http://127.0.0.1:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            proxy_pass http://127.0.0.1:8080/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /workorders/ {
            proxy_pass http://127.0.0.1:8080/workorders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /maintenance/ {
            proxy_pass http://127.0.0.1:8080/maintenance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /users/ {
            proxy_pass http://127.0.0.1:8080/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /activitylogs {
            proxy_pass http://127.0.0.1:8080/activitylogs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mutations/ {
            proxy_pass http://127.0.0.1:8080/mutations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =================================================================
    # HTTP Server (Port 80) — Redirect Otomatis HTTP -> HTTPS
    # =================================================================
    server {
        listen       80;
        server_name  172.17.10.109 localhost;
        return 301 https://$host$request_uri;
    }
}
